<!doctype html>
<html lang="en" data-time-theme="morning" data-time-scheme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f1e8da" />
		<!-- Chosen from the device clock before CSS paints; replaced in hooks.server.ts -->
		%petalbit.theme%
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@300..700&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				if (sessionStorage.getItem('petalbit:intro') === 'seen') {
					document.documentElement.dataset.intro = 'seen';
				}
			} catch {
				/* private mode, ignore */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
