<!doctype html>
<html lang="en" data-time-theme="morning" data-time-scheme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f1e8da" />
		<!-- Chosen from the device clock before CSS paints; replaced in hooks.server.ts -->
		%petalbit.theme%
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
		<!-- Fonts are self-hosted in src/fonts.css; preload the two faces the
		     first screen needs so they arrive without the swap flash. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/fraunces-normal-latin.woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/plus-jakarta-sans-normal-latin.woff2"
			crossorigin="anonymous"
		/>
		<script>
			try {
				if (sessionStorage.getItem('petalbit:intro') === 'seen') {
					document.documentElement.dataset.intro = 'seen';
				}
			} catch {
				/* private mode, ignore */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
